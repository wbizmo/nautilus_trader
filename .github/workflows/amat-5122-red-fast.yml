name: AMAT 5122 red fast validation

permissions:
  contents: read

on:
  push:
    branches:
      - validation/5122-red-fast

jobs:
  rust-tests:
    name: AMAT Rust tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.98.1
          cache: false
          override: true

      - name: Run AMAT tests
        run: cargo test -p nautilus-indicators --lib momentum::amat
